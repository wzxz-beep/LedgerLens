name: Quality checks
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run dependency-free domain tests
        run: node tests/run.js
      - name: Check JavaScript syntax
        run: node --check core.js && node --check app.js
